block/IWDG:
  description: Independent watchdog.
  items:
  - name: CTLR
    description: Key register (IWDG_CTLR).
    byte_offset: 0
    bit_size: 16
    access: Write
    fieldset: CTLR
  - name: PSCR
    description: Prescaler register (IWDG_PSCR).
    byte_offset: 4
    bit_size: 16
    fieldset: PSCR
  - name: RLDR
    description: Reload register (IWDG_RLDR).
    byte_offset: 8
    bit_size: 16
    fieldset: RLDR
  - name: STATR
    description: Status register (IWDG_STATR).
    byte_offset: 12
    bit_size: 16
    access: Read
    fieldset: STATR
fieldset/CTLR:
  description: Key register (IWDG_CTLR).
  fields:
  - name: KEY
    description: Key value (0x5555 unlocks PSCR/RLDR, 0xAAAA reloads, 0xCCCC starts).
    bit_offset: 0
    bit_size: 16
fieldset/PSCR:
  description: Prescaler register (IWDG_PSCR).
  fields:
  - name: PR
    description: Prescaler divider.
    bit_offset: 0
    bit_size: 3
fieldset/RLDR:
  description: Reload register (IWDG_RLDR).
  fields:
  - name: RL
    description: Watchdog counter reload value.
    bit_offset: 0
    bit_size: 12
fieldset/STATR:
  description: Status register (IWDG_STATR).
  fields:
  - name: PVU
    description: Watchdog prescaler value update.
    bit_offset: 0
    bit_size: 1
  - name: RVU
    description: Watchdog counter reload value update.
    bit_offset: 1
    bit_size: 1
